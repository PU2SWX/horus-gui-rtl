name: Build

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    build-windows:
        runs-on: [windows-latest]

        steps:

        - name: Checkout code
          uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip' # caching pip dependencies

        - name: Install pyAudio wheel
          run: pip install pyaudio

        - name: Install horusdemodlib
          run: pip install horusdemodlib

        - name: Install other dependencies
          run: pip install -r requirements.txt

        - name: Install pyinstaller
          run: pip install pyinstaller

        - name: Prep file locations
          shell: pwsh
          run: |
            New-Item -ItemType Directory -Force -Path dist | Out-Null

            $dlls = @(
                "libgcc_s_seh-1.dll",
                "libstdc++-6.dll",
                "libwinpthread-1.dll"
            )

            $roots = @(
                "$env:ProgramFiles\Git",
                "C:\Strawberry",
                "C:\ProgramData\chocolatey\lib\mingw"
            )

            $sourceDir = $null

            foreach ($root in $roots) {
                if (Test-Path $root) {
                    $files = Get-ChildItem -Path $root -Filter "libgcc_s_seh-1.dll" -File -Recurse -ErrorAction SilentlyContinue

                    foreach ($file in $files) {
                        $dir = $file.DirectoryName

                        $complete = $true
                        foreach ($dll in $dlls) {
                            if (-not (Test-Path (Join-Path $dir $dll))) {
                                $complete = $false
                                break
                            }
                        }

                        if ($complete) {
                            $sourceDir = $dir
                            break
                        }
                    }
                }

                if ($sourceDir) {
                    break
                }
            }

            if (-not $sourceDir) {
                throw "Could not locate all required MinGW DLL files."
            }

            Write-Host "DLL source directory: $sourceDir"

            foreach ($dll in $dlls) {
                Copy-Item (Join-Path $sourceDir $dll) .
            }

        - name: Run pyinstaller
          run: pyinstaller horus-gui_win.spec

        - name: Upload Artifact
          uses: actions/upload-artifact@v4
          with:
            name: horus-gui_WIN64.zip
            path: dist/horus-gui.exe
            retention-days: 2

    build-osx:
        runs-on: [macos-14]

        steps:

        - name: Checkout code
          uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip' # caching pip dependencies

        - name: Install Homebrew dependencies
          run: brew install portaudio
        
        - name: Install pyAudio wheel
          run: pip install pyaudio

        - name: Install horusdemodlib
          run: pip install horusdemodlib

        - name: Install other dependencies
          run: pip install -r requirements.txt

        - name: Install pyinstaller
          run: pip install pyinstaller

        - name: Prep file locations
          shell: bash
          run: |
            mkdir -p dist

        - name: ake dummy file for use in appbundle
          shell: bash
          run: |
            touch dummy.file

        - name: Run pyinstaller
          run: pyinstaller horus-gui_osx_runner.spec

        - name: Create the DMG file
          run: hdiutil create -format UDZO -srcfolder dist/horus-gui.app dist/horus-gui_OSX-M1.dmg

        - name: Upload Artifact
          uses: actions/upload-artifact@v4
          with:
            name: horus-gui_OSX-M1.zip
            path: dist/horus-gui_OSX-M1.dmg
            retention-days: 2

    # Currently having issues with portaudio and these builds...
    build-osx-intel:
        runs-on: [macos-15-intel]

        steps:

        - name: Checkout code
          uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip' # caching pip dependencies

        - name: Install Homebrew dependencies
          run: brew install portaudio
        
        - name: Install pyAudio wheel
          run: pip install pyaudio

        - name: Install horusdemodlib
          run: pip install horusdemodlib

        - name: Install other dependencies
          run: pip install -r requirements.txt

        - name: Install pyinstaller
          run: pip install pyinstaller

        - name: Prep file locations
          shell: bash
          run: |
            mkdir -p dist

        - name: Make dummy file for use in appbundle
          shell: bash
          run: |
            touch dummy.file

        - name: Run pyinstaller
          run: pyinstaller horus-gui_osx_runner.spec

        - name: Create the DMG file
          run: hdiutil create -format UDZO -srcfolder dist/horus-gui.app dist/horus-gui_OSX-Intel.dmg

        - name: Upload Artifact
          uses: actions/upload-artifact@v4
          with:
            name: horus-gui_OSX-Intel.zip
            path: dist/horus-gui_OSX-Intel.dmg
            retention-days: 2
    build-linux:
        runs-on: [ubuntu-22.04]

        steps:

        - name: Checkout code
          uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            cache: 'pip'

        - name: Install system dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y \
              portaudio19-dev \
              libportaudio2 \
              librtlsdr-dev \
              librtlsdr0 \
              libusb-1.0-0-dev \
              libusb-1.0-0

        - name: Install Python dependencies
          run: |
            python -m pip install --upgrade pip
            pip install pyaudio
            pip install horusdemodlib
            pip install -r requirements.txt
            pip install pyinstaller

        - name: Run PyInstaller
          run: pyinstaller horus-gui.spec

        - name: Check native dependencies
          run: |
            if [ ! -x dist/horus-gui/horus-gui ]; then
                echo "Linux executable not found!"
                exit 1
            fi

            ldd_output=$(ldd dist/horus-gui/horus-gui)
            echo "$ldd_output"

            if echo "$ldd_output" | grep -q "not found"; then
                echo "Missing native dependencies!"
                exit 1
            fi
        - name: Create Linux archive
          run: |
            tar -czf dist/horus-gui_LINUX64.tar.gz -C dist horus-gui
        - name: Upload Artifact
          uses: actions/upload-artifact@v4
          with:
            name: horus-gui_LINUX64
            path: dist/horus-gui_LINUX64.tar.gz
            retention-days: 2